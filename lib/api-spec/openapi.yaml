openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Food News Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: news
    description: News operations
  - name: crawl
    description: Crawling operations
  - name: tariffs
    description: Tariff information
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Get all news articles
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of news articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsArticle"

  /news/stats:
    get:
      operationId: getNewsStats
      tags: [news]
      summary: Get news statistics
      responses:
        "200":
          description: News statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsStats"

  /crawl:
    post:
      operationId: triggerCrawl
      tags: [crawl]
      summary: Trigger news crawling
      responses:
        "200":
          description: Crawl result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlResult"

  /tariffs:
    get:
      operationId: getTariffs
      tags: [tariffs]
      summary: Get tariff information
      responses:
        "200":
          description: Tariff information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TariffInfo"

  /keywords:
    get:
      operationId: getKeywordConfig
      tags: [keywords]
      summary: Get keyword alert configuration
      responses:
        "200":
          description: Keyword configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordConfig"
    put:
      operationId: saveKeywordConfig
      tags: [keywords]
      summary: Save keyword alert configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordConfig"
      responses:
        "200":
          description: Updated keyword configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordConfig"

  /sheets/status:
    get:
      operationId: getSheetsStatus
      tags: [sheets]
      summary: Get Google Sheets connection status
      responses:
        "200":
          description: Sheets status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetsStatus"

  /sheets/export:
    post:
      operationId: exportToSheets
      tags: [sheets]
      summary: Manually export news articles to Google Sheets
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetsExportResult"

  /schedule:
    get:
      operationId: getScheduleStatus
      tags: [crawl]
      summary: Get auto-crawl schedule status
      responses:
        "200":
          description: Schedule status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStatus"
    post:
      operationId: toggleSchedule
      tags: [crawl]
      summary: Toggle auto-crawl schedule on or off
      responses:
        "200":
          description: Updated schedule status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    NewsArticle:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        link:
          type: string
        pubDate:
          type: string
        keywords:
          type: array
          items:
            type: string
        source:
          type: string
        timestamp:
          type: string
      required:
        - id
        - category
        - title
        - link
        - pubDate
        - keywords
        - source
        - timestamp

    NewsStats:
      type: object
      properties:
        total:
          type: integer
        byCategory:
          type: object
          additionalProperties:
            type: integer
        lastCrawled:
          type: ["string", "null"]
        sources:
          type: object
          properties:
            naver:
              type: integer
            google:
              type: integer
          required:
            - naver
            - google
      required:
        - total
        - byCategory
        - lastCrawled
        - sources

    CrawlResult:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
        message:
          type: string
      required:
        - status
        - count
        - message

    TariffInfo:
      type: object
      properties:
        source:
          type: string
        lastUpdated:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/TariffItem"
      required:
        - source
        - lastUpdated
        - items

    TariffItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        link:
          type: string
        keywords:
          type: array
          items:
            type: string
        description:
          type: string
        timestamp:
          type: string
      required:
        - id
        - title
        - link
        - keywords
        - description
        - timestamp

    KeywordEntry:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        enabled:
          type: boolean
      required:
        - id
        - value
        - enabled

    KeywordConfig:
      type: object
      properties:
        high:
          type: array
          items:
            $ref: "#/components/schemas/KeywordEntry"
        medium:
          type: array
          items:
            $ref: "#/components/schemas/KeywordEntry"
      required:
        - high
        - medium

    SheetsStatus:
      type: object
      properties:
        connected:
          type: boolean
        sheetId:
          type: ["string", "null"]
        lastExportAt:
          type: ["string", "null"]
        lastExportCount:
          type: ["integer", "null"]
        totalRows:
          type: ["integer", "null"]
        error:
          type: ["string", "null"]
      required:
        - connected
        - sheetId
        - lastExportAt
        - lastExportCount
        - totalRows
        - error

    SheetsExportResult:
      type: object
      properties:
        success:
          type: boolean
        newRows:
          type: integer
        skippedDuplicates:
          type: integer
        totalRows:
          type: integer
        exportedAt:
          type: string
        message:
          type: string
        error:
          type: ["string", "null"]
      required:
        - success
        - newRows
        - skippedDuplicates
        - totalRows
        - exportedAt
        - message
        - error

    ScheduleStatus:
      type: object
      properties:
        enabled:
          type: boolean
        intervalHours:
          type: integer
        nextRun:
          type: ["string", "null"]
        lastRun:
          type: ["string", "null"]
        alertKeywords:
          type: array
          items:
            type: string
        slackEnabled:
          type: boolean
      required:
        - enabled
        - intervalHours
        - nextRun
        - lastRun
        - alertKeywords
        - slackEnabled
